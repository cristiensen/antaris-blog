name: Test Environment

on:
  push:
    branches: ["test"]
  pull_request:
    branches: ["test"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DB_PASSWORD_TEST: ${{ secrets.DB_PASSWORD_TEST }}

    steps:
      - name: db pass test
        run: |
          if [ -z "$DB_PASSWORD_TEST" ]; then
            echo "DB_PASSWORD_TEST is EMPTY"
            exit 1
          else
            echo "DB_PASSWORD_TEST is SET to a non null value"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker info
        run: |
          docker version
          docker compose version

      - name: Compose up (Test)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d

      - name: Wait for SQL port
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then
              echo "SQL is accepting TCP connections"
              exit 0
            fi
            echo "Waiting for SQL... ($i/60)"
            sleep 2
          done
          echo "SQL did not become ready in time"
          docker ps
          docker logs --tail 200 antaris-sql-test || true
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Debug repo layout
        run: |
          pwd
          ls -la
          echo "---- csproj files ----"
          find . -maxdepth 4 -name "*.csproj" -print


      - name: Apply EF Core migrations (Test)
        run: |
          set -euo pipefail
          CSPROJ="$(find . -maxdepth 6 -name "*.csproj" | head -n 1)"
          echo "Using project: $CSPROJ"
          dotnet restore "$CSPROJ"
          dotnet ef database update \
            --project "$CSPROJ" \
            --startup-project "$CSPROJ" \
            --connection "Server=localhost,1433;Database=AntarisBlogTest;User Id=sa;Password=$DB_PASSWORD_TEST;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True;"
          env:
          DB_PASSWORD_TEST: ${{ secrets.DB_PASSWORD_TEST }}
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AntarisBlogTest;User Id=sa;Password=${{ secrets.DB_PASSWORD_TEST }};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True;"
          ASPNETCORE_ENVIRONMENT: Test
            
      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:4200/api/health > /dev/null; then
              echo "API health is OK"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs --tail 200 antaris-api || true
          docker logs --tail 200 antaris-web || true
          exit 1

      - name: Show running containers
        if: always()
        run: |
          docker ps
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps

      - name: Compose ps + SQL health details (on failure)
        if: failure()
        run: |
          echo "---- SQL inspect ----"
          docker inspect antaris-sql-test --format='{{json .State.Health}}' || true
          echo "---- SQL logs (last 200) ----"
          docker logs --tail 200 antaris-sql-test || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
